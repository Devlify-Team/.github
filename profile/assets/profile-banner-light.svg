<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Devlify Team — dependable digital products</title>
  <desc id="desc">Animated light banner with a subtle grid, glowing orbit, and the message: We build dependable digital products for real-world needs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset=".58" stop-color="#f0f6ff"/><stop offset="1" stop-color="#f5f0ff"/></linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#263b57"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b78637"/><stop offset="1" stop-color="#d0a85c"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".20"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#62748b" stroke-opacity=".10"/></pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="44"/></filter>
    <clipPath id="clip"><rect width="1200" height="340" rx="28"/></clipPath>
  </defs>
  <style>
    .floatA{animation:driftA 13s ease-in-out infinite alternate}.floatB{animation:driftB 17s ease-in-out infinite alternate}
    .orbit{transform-origin:970px 170px;animation:spin 36s linear infinite}.orbit2{transform-origin:970px 170px;animation:spin 24s linear infinite reverse}
    .pulse{animation:pulse 2.8s ease-in-out infinite}.twinkle{animation:twinkle 4s ease-in-out infinite alternate}
    .shine{animation:shine 7s ease-in-out 1s infinite}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    @keyframes driftA{to{transform:translate(32px,-18px)}}@keyframes driftB{to{transform:translate(-28px,20px)}}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.42;transform:scale(1.2)}}
    @keyframes twinkle{from{opacity:.2}to{opacity:.8}}@keyframes shine{0%{transform:translateX(-260px)}35%,100%{transform:translateX(670px)}}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <g filter="url(#blur)"><ellipse class="floatA" cx="1030" cy="145" rx="290" ry="175" fill="#22d3ee" opacity=".23"/><ellipse class="floatB" cx="1140" cy="330" rx="280" ry="150" fill="#8b5cf6" opacity=".18"/><ellipse class="floatA" cx="110" cy="350" rx="320" ry="100" fill="#c9a96a" opacity=".15"/></g>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <g fill="#64748b"><circle class="twinkle" cx="390" cy="54" r="1.3"/><circle class="twinkle" cx="640" cy="287" r="1.1" style="animation-delay:-1.8s"/><circle class="twinkle" cx="222" cy="272" r="1.4" style="animation-delay:-.7s"/><circle class="twinkle" cx="810" cy="61" r="1.1" style="animation-delay:-2.3s"/><circle class="twinkle" cx="555" cy="180" r="1" style="animation-delay:-1.1s"/></g>
    <g class="rise" style="animation-delay:.12s">
      <rect x="72" y="54" width="290" height="32" rx="16" fill="#fff" stroke="#a9d7e2"/>
      <circle class="pulse" cx="92" cy="70" r="4" fill="#059669"/>
      <text x="108" y="75" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" letter-spacing="1.4" fill="#155e75">SOFTWARE · PRODUCTS · ENGINEERING</text>
    </g>
    <g class="rise" style="animation-delay:.3s">
      <text x="70" y="157" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="750" letter-spacing="-2" fill="url(#titleFill)">Devlify Team</text>
      <clipPath id="titleClip"><text x="70" y="157" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="750" letter-spacing="-2">Devlify Team</text></clipPath>
      <rect class="shine" x="0" y="90" width="140" height="80" fill="#fff" opacity=".5" clip-path="url(#titleClip)"/>
    </g>
    <rect x="74" y="180" width="146" height="3" rx="1.5" fill="url(#gold)"/>
    <rect x="226" y="180" width="58" height="3" rx="1.5" fill="url(#accent)"/>
    <g class="rise" style="animation-delay:.55s">
      <text x="72" y="224" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#26364d">We build dependable digital products</text>
      <text x="72" y="259" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#56677e">for real-world needs.</text>
    </g>
    <g class="rise" style="animation-delay:.75s" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" letter-spacing="1.1">
      <rect x="72" y="286" width="445" height="30" rx="15" fill="#fff" stroke="#d6dce7"/>
      <text x="90" y="306" fill="#0e7490">WEB</text><circle cx="137" cy="301" r="2" fill="#b78637"/>
      <text x="151" y="306" fill="#6d28d9">MOBILE</text><circle cx="217" cy="301" r="2" fill="#b78637"/>
      <text x="231" y="306" fill="#0e7490">PLATFORMS</text><circle cx="326" cy="301" r="2" fill="#b78637"/>
      <text x="341" y="306" fill="#6d28d9">AI/ML</text><circle cx="397" cy="301" r="2" fill="#b78637"/>
      <text x="411" y="306" fill="#0e7490">TOOLS</text>
    </g>
    <g transform="translate(970 170)">
      <circle r="142" fill="url(#glow)"/>
      <g class="orbit"><circle r="120" fill="none" stroke="#0891b2" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="2 8"/><circle cx="0" cy="-120" r="4" fill="#b78637"/><circle cx="120" cy="0" r="3" fill="#0891b2"/></g>
      <g class="orbit2"><circle r="91" fill="none" stroke="url(#accent)" stroke-opacity=".72" stroke-width="2" stroke-dasharray="42 18"/><circle cx="0" cy="-91" r="5" fill="#7c3aed"/><circle cx="0" cy="91" r="4" fill="#0891b2"/></g>
      <circle class="pulse" r="61" fill="none" stroke="#0891b2" stroke-width="1.5" opacity=".68"/>
      <path d="M0-48 42-24 42 24 0 48-42 24-42-24Z" fill="#fff" stroke="url(#gold)" stroke-width="2"/>
      <path d="M0-36 31-18 31 18 0 36-31 18-31-18Z" fill="none" stroke="#0891b2" stroke-opacity=".3"/>
      <text y="10" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#8b6a2e">DT</text>
      <circle cx="0" cy="0" r="3" fill="#0f172a"/>
    </g>
    <rect x=".75" y=".75" width="1198.5" height="338.5" rx="27.25" fill="none" stroke="#63748b" stroke-opacity=".25" stroke-width="1.5"/>
  </g>
</svg>
