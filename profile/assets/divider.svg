<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" role="presentation" aria-hidden="true">
  <defs><linearGradient id="left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6cf9d" stop-opacity="0"/><stop offset="1" stop-color="#e6cf9d" stop-opacity=".55"/></linearGradient><linearGradient id="right" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient><linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="line"><rect x="0" y="12" width="900" height="3"/></clipPath></defs>
  <style>.run{animation:run 5s ease-in-out infinite}.gem{transform-origin:center;animation:gem 6s ease-in-out infinite}@keyframes run{from{transform:translateX(-140px)}to{transform:translateX(900px)}}@keyframes gem{50%{transform:rotate(90deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
